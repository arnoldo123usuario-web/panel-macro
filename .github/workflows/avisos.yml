# Avisos a Telegram aunque la PC esté apagada.
# Horas en UTC (México = UTC-6 todo el año): 12:30 UTC = 6:30 a.m. en México.
# GitHub a veces corre los horarios unos minutos tarde; por eso el recordatorio sale con 20 min de margen.
name: Avisos a Telegram

on:
  schedule:
    - cron: "30 12 * * 1-5"      # agenda del día, lunes a viernes 6:30 México
    - cron: "*/5 11-20 * * 1-5"  # recordatorios antes de cada dato fuerte (5:00 a 14:55 México)
  workflow_dispatch:             # botón "Run workflow" para probar
    inputs:
      modo:
        description: "agenda o recordatorios"
        default: "agenda"

permissions:
  contents: write                # para guardar qué ya se avisó (avisos/estado.json)

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Mandar avisos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          HORARIO: ${{ vars.HORARIO || '09:30-11:00' }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || (github.event.schedule == '30 12 * * 1-5' && 'agenda' || 'recordatorios') }}
        run: python3 avisos/avisos.py "$MODO"

      - name: Guardar lo que ya se avisó
        run: |
          git add avisos/estado.json avisos/semana.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Avisos: estado"
            git pull --rebase --quiet && git push --quiet
          fi
